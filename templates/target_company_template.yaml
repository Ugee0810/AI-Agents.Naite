# ============================================================
# 応募先企業情報テンプレート (Target Company Info Template)
# ============================================================
# 아래 항목을 기입해주세요.
# 에이전트가 이 정보를 바탕으로 최적의 면접 답변을 작성합니다.
# 정보가 충실할수록, 더 높은 품질의 답변이 생성됩니다.
#
# 기입 방법
# 한 줄
# → "값" 또는 값 그대로 기입
# 여러 줄
# → | 기호 뒤에 줄바꿈 후, 2칸 들여쓰기로 내용을 붙여넣기
# 리스트
# → - "항목" 형식으로 기입

# ============================================================
# 企業基本情報 / 기업 기본 정보
# ============================================================
company:

  # 企業名 / 기업명
  name: ""

  # 事業内容 / 사업 내용
  business: ""

  # 企業HP / 기업 홈페이지
  website: ""

# ============================================================
# 経営情報 / 경영정보
# ============================================================
# 최종 면접에서는 대표·임원이 면접관이 되므로, 경영이념이나 비전에 대한 이해와 공감을 보여주는 것이 매우 중요합니다.
management:

  # 代表者挨拶 / 대표자 인사말
  ceo_message: ""

  # ビジョン・目指すもの / 비전·지향점
  vision: ""

  # 経営理念 / 경영이념
  philosophy: ""

  # 経営方針 / 경영방침
  policy: ""

  # 成長戦略・今後の展望 / 성장전략·향후 전망
  growth_strategy: ""

# ============================================================
# 応募ポジション情報 / 응모 포지션 정보
# ============================================================
position:

  # 応募職種名 / 응모 직종명
  title: ""

  # 仕事内容（詳細）/ 업무 내용(상세)
  description: ""

  # 必須要件 / 필수 요건
  requirements: ""

  # 歓迎要件 / 우대 사항
  preferred: ""

  # 企業の魅力・おすすめポイント / 기업 매력·추천 포인트
  appeal_points: ""

  # 福利厚生・待遇 / 복리후생·대우
  benefits: ""

  # この仕事のやりがい＆厳しさ / 이 업무의 보람과 어려움
  job_reward_and_challenge:

    # やりがい / 보람
    reward: ""

    # 厳しさ / 어려움
    challenge: ""

  # この仕事の向き＆不向き / 이 업무에 맞는 사람과 맞지 않는 사람
  job_fit:

    # 向いている人 / 맞는 사람
    suitable_for: ""

    # 向いていない人 / 맞지 않는 사람
    unsuitable_for: ""

  # その他参考情報 / 기타 참고 사항
  additional_info: ""

# ============================================================
# 背景知識メモ / 배경지식 메모
# ============================================================
# 아래는 면접에서 깊게 물어볼 수 있는 포인트를 정리하기 위한 자유 기술란입니다.
# 사전에 정리해 두면 답변의 일관성과 설득력이 높아집니다.
background_notes:

  # 転職の軸と転職理由 / 전직의 축과 전직 이유
  tensyoku_axis_and_reason: ""

  # 前職から現職への転職メモ / 이전 직장에서 현 직장으로의 전직 메모
  # ※ 직근 전직의 축과 이유를 깊게 물어볼 가능성이 높기 때문에, 현재 재직 중인 회사(또는 가장 최근 회사)의 입사 이유 및 그 이전 회사 퇴사 이유를 정리해주세요.
  previous_to_current_job: ""

  # 成長背景 / 성장 배경
  # 오늘날까지의 배경, 커리어 형성 스토리 등
  growth_background: ""

  # 自身の強みと弱み / 자신의 강점과 약점
  # ※ 이력서/직무경력서에 명확히 드러나지 않는다면 아래 질문을 참고해 작성해 보세요.
  # Q1. 주변 동료들에게 자주 칭찬받거나 의지받는 부분은 무엇인가요? (강점)
  # Q2. 업무를 하면서 가장 스트레스를 받거나 피하고 싶은 일은 무엇인가요? (약점)
  # Q3. 그 약점을 극복하거나 보완하기 위해 어떤 노력을 하고 있나요?
  strengths_and_weaknesses: ""

  # やりがいを感じるのはどんな時か / 일의 보람을 느끼는 순간
  # ※ 가치관과 직업관을 파악하기 위한 항목입니다.
  # Q1. 과거 업무 중 시간 가는 줄 모르고 몰입했던 일은 무엇인가요?
  # Q2. 스스로 가장 큰 성취감을 느꼈던 순간은 언제인가요?
  # Q3. 반대로, 어떤 상황에서 가장 일할 의욕이 떨어지나요?
  core_motivations: ""

  # 最も困難だった経験 / 가장 어려웠던(또는 실패했던) 경험
  # ※ 문제 해결 능력과 회복탄력성(Resilience)을 보여주기 위한 항목입니다.
  # Q1. 업무 중 가장 큰 좌절이나 벽에 부딪혔던 사건은 무엇인가요?
  # Q2. 그 상황을 어떻게 극복했나요? (당시 취했던 구체적인 행동)
  # Q3. 그 경험을 통해 배운 점은 무엇이며, 지금 어떻게 적용하고 있나요?
  hardest_experience: ""

  # 今回の面接で強調したいポイント
  # ※ 이번 전형에서 특별히 어필하고 싶은 내용을 자유롭게 기입하세요.
  interview_focus: ""

  # その他のメモ / 기타 메모
  # 피드백, 면접관으로부터의 어드바이스 등 자유 기록
  other_notes: ""
