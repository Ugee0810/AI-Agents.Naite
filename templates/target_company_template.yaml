# ====================================
# 応募先企業情報 (Target Company Info)
# ====================================
# 以下の項目を記入してください。
# エージェントがこの情報を基に、最適な面接回答を作成します。
#
# 아래 항목을 기입해주세요.
# 에이전트가 이 정보를 바탕으로 최적의 면접 답변을 작성합니다.
#
# ★ 기입 방법 / 記入方法:
#   한 줄짜리 → "값" 또는 값 그대로 기입
#   여러 줄짜리 → | 기호 뒤에 줄바꿈 후, 2칸 들여쓰기로 내용을 붙여넣기
#   리스트 → - "항목" 형식으로 기입

company:
  name: ""
  industry: ""
  business: |
    ここに事業内容を貼り付けてください。
    複数行でもそのまま貼り付けられます。
  products:
    # - "製品A"
    # - "サービスB"
  tech_stack:
    # - "Python"
    # - "AWS"
  culture: ""
  website: ""

# ====================================
# 経営情報（最終面接で重要）
# 경영 정보 (최종 면접에서 중요)
# ====================================
# 最終面接では代表者・役員が面接官となるため、
# 経営理念やビジョンへの理解と共感を示すことが重要です。
#
# 최종 면접에서는 대표·임원이 면접관이 되므로,
# 경영이념이나 비전에 대한 이해와 공감을 보여주는 것이 중요합니다.
#
# ★ HPの「代表挨拶」「経営理念」ページをそのままコピペしてOKです

management:
  # 代表者挨拶 / 대표자 인사말 (HPから引用)
  ceo_message: |

  # 経営理念・目指すもの・ビジョン / 경영이념·비전
  philosophy: |

  # 経営方針 / 경영방침
  policy: |

  # 成長戦略・今後の展望 / 성장전략·향후 전망
  growth_strategy: |


position:
  title: ""
  description: |

  requirements:
    # - "3年以上の開発経験"
    # - "日本語N2以上"
  preferred:
    # - "チームリーダー経験"
  team_size: ""

appeal_points:
  # - "グローバル展開に積極的"
  # - "リモートワーク可"

# 面接段階 / 면접 단계
# "最終面接" / "1次面接" / "2次面接"
interview_stage: ""

# その他参考情報 / 기타 참고 사항
additional_info: |


# ====================================
# 背景知識メモ（面接の深掘りに備えて）
# 배경지식 메모 (면접 심층 질문 대비)
# ====================================
# 以下は面接で深掘りされやすいポイントをまとめるための自由記述欄です。
# 事前に整理しておくと、回答の一貫性と説得力が高まります。
#
# 아래는 면접에서 깊게 물어볼 수 있는 포인트를 정리하기 위한 자유 기술란입니다.
# 사전에 정리해 두면 답변의 일관성과 설득력이 높아집니다.
#
# ★ 각 항목에 여러 줄을 자유롭게 붙여넣기 하세요.
#   | 기호 다음 줄부터, 4칸 들여쓰기로 내용을 기입하면 됩니다.

background_notes:

  # -----------------------------------------------
  # 転職の軸と転職理由 / 전직의 축과 전직 이유
  # -----------------------------------------------
  # 例:
  # *[경영상 인원 정리로 인한 이직]*
  # 前職ではCTOの勧誘により、自社サービスアプリのリリースや
  # 東大病院連携プロジェクトを推進してきましたが、...
  tensyoku_axis_and_reason: |


  # -----------------------------------------------
  # 1社目→2社目の転職メモ / 1사→2사 전직 메모
  # -----------------------------------------------
  # ※ 2社目は「やむを得ない」認識があるため、
  #   1社目→2社目の転職の軸と理由が深掘りされる可能性が高い
  first_to_second_job: |


  # -----------------------------------------------
  # 成長背景 / 성장 배경
  # -----------------------------------------------
  # 来日のきっかけ、キャリア形成のストーリー等
  # 例:
  # 1. 中学生の時、初の海外旅行で九州を訪れ...
  # 2. 兵役時代にワーキングホリデーを目標に...
  growth_background: |


  # -----------------------------------------------
  # 企業からの評価・フィードバック
  # 기업으로부터의 평가·피드백
  # -----------------------------------------------
  # エージェントや企業から受けた評価コメントを貼り付けてください。
  # 例:
  # C#の実装力に加え、Pythonを用いた生成AI領域への探究心など、
  # 非常に高い技術ポテンシャルを評価いたしました。
  # また、日本語での円滑なコミュニケーション能力や...
  company_feedback: |


  # -----------------------------------------------
  # 選考のポイント / 선고 포인트
  # -----------------------------------------------
  # エージェントから共有された選考のポイントを貼り付けてください。
  # 例:
  # ◎技術に対する興味・関心がどのくらいあるか
  # ◎今後のキャリアイメージについて
  selection_points: |


  # -----------------------------------------------
  # その他のメモ / 기타 메모
  # -----------------------------------------------
  # フィードバック、面接官からのアドバイス等を自由に記録
  other_notes: |

